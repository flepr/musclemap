<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MuscleMap">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preload" href="fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<title>MuscleMap</title>
<link rel="stylesheet" href="css/app.css">
<script>
  /* Thème appliqué avant l'affichage (évite un flash) */
  (function () {
    var pref = 'auto';
    try { pref = (JSON.parse(localStorage.getItem('musclemap.settings.v1')) || {}).theme || 'auto'; } catch (e) {}
    var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
</head>
<body>
<div id="gate" hidden></div>
<div id="app" hidden>
  <main id="view" class="wrap"></main>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="overlay"></div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importInput" accept="application/json,.json" hidden>
<noscript>MuscleMap a besoin de JavaScript. · MuscleMap needs JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
