<link rel="stylesheet" href="css/app.css">
<script>
  /* Thème appliqué avant l'affichage (évite un flash) */
  (function () {
    var pref = 'auto';
    try { pref = (JSON.parse(localStorage.getItem('musclemap.settings.v1')) || {}).theme || 'auto'; } catch (e) {}
    var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
</head>
<body>
<div id="gate" hidden></div>
<div id="app" hidden>
  <main id="view" class="wrap"></main>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="overlay"></div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importInput" accept="application/json,.json" hidden>
<noscript>MuscleMap a besoin de JavaScript. · MuscleMap needs JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
