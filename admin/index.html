<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e0f11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MM Admin">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>MuscleMap Admin</title>
<link rel="stylesheet" href="admin.css">
<script>
  (function () {
    var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
</head>
<body>
<header class="top">
  <div class="brand">MUSCLE<span>MAP</span> <em>ADMIN</em></div>
  <div class="actions" id="actions" hidden>
    <button class="icon" data-act="refresh" aria-label="Actualiser" title="Actualiser">↻</button>
    <button class="icon" data-act="logout" aria-label="Se déconnecter" title="Se déconnecter">⎋</button>
  </div>
</header>
<main id="view"><p class="muted center">Chargement…</p></main>
<div id="tip" class="tip" hidden></div>
<script type="module" src="admin.js"></script>
</body>
</html>
